<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Sistema CATI USGP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

    <nav class="bg-red-800 text-white shadow-lg border-b border-red-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-3">
                <div class="flex items-center bg-white px-3.5 py-1.5 rounded-xl shadow-md border border-slate-200">
                    <img src="logo-emprendimiento.jpg" alt="Emprendimiento USGP" class="h-10 w-auto object-contain">
                </div>
                <div class="text-center hidden sm:block">
                    <span class="block text-sm font-bold tracking-wide uppercase text-white">Gestión de Propiedad Intelectual</span>
                    <span class="text-[11px] text-red-200">Universidad San Gregorio de Portoviejo</span>
                </div>
                <div class="flex items-center bg-white px-3.5 py-1.5 rounded-xl shadow-md border border-slate-200">
                    <img src="logo-CATI-2026-new.jpg" alt="CATI USGP" class="h-10 w-auto object-contain">
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-center py-10 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            
            <div class="flex border-b border-slate-200 text-sm font-semibold">
                <button id="btnTabLogin" onclick="cambiarTab('login')" class="w-1/2 py-4 text-center text-red-700 bg-white border-b-2 border-red-700 transition">Iniciar Sesión</button>
                <button id="btnTabRegistro" onclick="cambiarTab('registro')" class="w-1/2 py-4 text-center text-slate-500 bg-slate-50 hover:text-slate-700 hover:bg-slate-100 transition">Crear Cuenta</button>
            </div>

            <div class="p-6">
                <div id="errorContainer" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded-lg font-semibold text-xs text-center">
                    <span id="errorTexto"></span>
                </div>
                <div id="successContainer" class="hidden mb-4 bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-2 rounded-lg font-semibold text-xs text-center">
                    <span id="successTexto"></span>
                </div>

                <!-- FORMULARIO LOGIN -->
                <form id="formLogin" class="space-y-4 block">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Correo Institucional</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" id="loginEmail" required placeholder="usuario@sangregorio.edu.ec" 
                                   class="w-full pl-10 pr-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-700 focus:border-red-700 transition">
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-semibold text-slate-700 uppercase">Contraseña</label>
                        </div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-key"></i></span>
                            <input type="password" id="loginPassword" required placeholder="••••••••" 
                                   class="w-full pl-10 pr-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-700 focus:border-red-700 transition">
                        </div>
                    </div>
                    <button type="submit" id="btnLoginSubmit" class="w-full bg-red-700 hover:bg-red-800 text-white font-medium py-2.5 rounded-lg text-sm shadow-md transition">
                        Ingresar a la Plataforma
                    </button>
                </form>

                <!-- FORMULARIO REGISTRO -->
                <form id="formRegistro" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nombres y Apellidos Completos</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                            <input type="text" id="regNombre" required placeholder="Ej. Lcda. María Pérez" 
                                   class="w-full pl-10 pr-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-700 transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Correo Institucional (USGP)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" id="regEmail" required placeholder="usuario@sangregorio.edu.ec" 
                                   class="w-full pl-10 pr-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-700 transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Contraseña</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-key"></i></span>
                            <input type="password" id="regPassword" required minlength="6" placeholder="Mínimo 6 caracteres" 
                                   class="w-full pl-10 pr-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-700 transition">
                        </div>
                    </div>
                    <button type="submit" id="btnRegSubmit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-lg text-sm shadow-md transition">
                        Registrarme como Solicitante
                    </button>
                </form>
            </div>
        </div>

        <div class="mt-8 flex flex-col items-center justify-center text-center space-y-1">
            <span class="text-[11px] font-medium text-slate-500 uppercase tracking-wider">Desarrollado por</span>
            <div class="bg-white px-4 py-1.5 rounded-xl shadow-sm border border-slate-200">
                <img src="logo-grow-26.jpg" alt="Grow Innovation Lab" class="h-7 w-auto object-contain">
            </div>
        </div>
    </main>

    <script>
        const errContainer = document.getElementById('errorContainer');
        const errTexto = document.getElementById('errorTexto');
        const successContainer = document.getElementById('successContainer');
        const successTexto = document.getElementById('successTexto');

        function cambiarTab(tab) {
            errContainer.classList.add('hidden'); successContainer.classList.add('hidden');
            const formLogin = document.getElementById('formLogin'), formRegistro = document.getElementById('formRegistro');
            const btnLogin = document.getElementById('btnTabLogin'), btnRegistro = document.getElementById('btnTabRegistro');

            if (tab === 'login') {
                formLogin.classList.replace('hidden', 'block'); formRegistro.classList.replace('block', 'hidden');
                btnLogin.className = "w-1/2 py-4 text-center text-red-700 bg-white border-b-2 border-red-700 transition";
                btnRegistro.className = "w-1/2 py-4 text-center text-slate-500 bg-slate-50 hover:bg-slate-100 transition";
            } else {
                formRegistro.classList.replace('hidden', 'block'); formLogin.classList.replace('block', 'hidden');
                btnRegistro.className = "w-1/2 py-4 text-center text-red-700 bg-white border-b-2 border-red-700 transition";
                btnLogin.className = "w-1/2 py-4 text-center text-slate-500 bg-slate-50 hover:bg-slate-100 transition";
            }
        }

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            errContainer.classList.add('hidden');
            const btn = document.getElementById('btnLoginSubmit');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Ingresando...'; 
            btn.disabled = true;
            
            try {
                const emailInput = document.getElementById('loginEmail').value.trim();
                const passwordInput = document.getElementById('loginPassword').value;

                const { data: authData, error: authError } = await window.supabaseClient.auth.signInWithPassword({ 
                    email: emailInput, 
                    password: passwordInput 
                });
                
                if (authError) throw new Error(`Credenciales incorrectas.`);

                const { data: profile, error: profileError } = await window.supabaseClient.from('profiles')
                    .select('rol')
                    .eq('id', authData.user.id)
                    .maybeSingle();

                if (profileError) throw profileError;

                let rol = profile ? profile.rol : 'solicitante';
                window.location.href = (rol !== 'solicitante') ? 'admin_dashboard.html' : 'mis_tramites.html';

            } catch (err) {
                errTexto.innerText = err.message; 
                errContainer.classList.remove('hidden');
            } finally {
                btn.disabled = false; 
                btn.innerHTML = 'Ingresar a la Plataforma';
            }
        });

        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            errContainer.classList.add('hidden'); 
            successContainer.classList.add('hidden');
            
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;
            const nombre_completo = document.getElementById('regNombre').value.trim();
            const btn = document.getElementById('btnRegSubmit');
            
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Registrando...'; 
            btn.disabled = true;
            
            try {
                const { data, error } = await window.supabaseClient.rpc('registrar_solicitante', {
                    p_email: email,
                    p_password: password,
                    p_nombre_completo: nombre_completo
                });
                
                if (error) throw error;
                if (data && data.success === false) throw new Error(data.error);
                
                await window.supabaseClient.auth.signInWithPassword({ 
                    email: email, 
                    password: password 
                });

                window.location.href = 'mis_tramites.html';
                
            } catch (err) {
                errTexto.innerText = "Error: El correo ya existe o hubo un problema en el servidor."; 
                errContainer.classList.remove('hidden');
            } finally {
                btn.disabled = false; 
                btn.innerHTML = 'Registrarme como Solicitante';
            }
        });
    </script>
</body>
</html>

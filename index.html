<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - CATI USGP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">
    <nav class="bg-red-800 text-white shadow-lg border-b border-red-900 py-4 px-6 flex justify-between items-center">
        <h1 class="font-bold uppercase tracking-wide">Sistema CATI USGP</h1>
    </nav>
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-xl shadow-xl overflow-hidden">
            <div class="flex border-b text-sm font-bold">
                <button id="tabLogin" onclick="setTab('login')" class="w-1/2 py-4 text-red-700 border-b-2 border-red-700">Iniciar Sesión</button>
                <button id="tabReg" onclick="setTab('reg')" class="w-1/2 py-4 text-gray-500 bg-gray-50">Crear Cuenta</button>
            </div>
            <div class="p-6">
                <div id="msg" class="hidden mb-4 p-3 rounded text-sm text-center font-bold"></div>
                <form id="formLogin" class="space-y-4">
                    <input type="email" id="logEmail" required placeholder="Correo" class="w-full p-3 border rounded focus:ring-2 focus:ring-red-700">
                    <input type="password" id="logPass" required placeholder="Contraseña" class="w-full p-3 border rounded focus:ring-2 focus:ring-red-700">
                    <button type="submit" id="btnLog" class="w-full bg-red-700 text-white p-3 rounded font-bold">Ingresar</button>
                </form>
                <form id="formReg" class="space-y-4 hidden">
                    <input type="text" id="regNom" required placeholder="Nombre Completo" class="w-full p-3 border rounded">
                    <input type="email" id="regEmail" required placeholder="Correo Institucional" class="w-full p-3 border rounded">
                    <input type="password" id="regPass" required placeholder="Contraseña (mín 6)" class="w-full p-3 border rounded">
                    <button type="submit" id="btnRegSubmit" class="w-full bg-gray-800 text-white p-3 rounded font-bold">Registrarme</button>
                </form>
            </div>
        </div>
    </main>
    <script>
        const msg = document.getElementById('msg');
        function setTab(t) {
            msg.classList.add('hidden');
            document.getElementById('formLogin').classList.toggle('hidden', t !== 'login');
            document.getElementById('formReg').classList.toggle('hidden', t === 'login');
            document.getElementById('tabLogin').className = t === 'login' ? "w-1/2 py-4 text-red-700 border-b-2 border-red-700" : "w-1/2 py-4 text-gray-500 bg-gray-50";
            document.getElementById('tabReg').className = t === 'reg' ? "w-1/2 py-4 text-red-700 border-b-2 border-red-700" : "w-1/2 py-4 text-gray-500 bg-gray-50";
        }
        function showMsg(txt, err=true) {
            msg.className = `mb-4 p-3 rounded text-sm text-center font-bold ${err ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            msg.innerText = txt; msg.classList.remove('hidden');
        }
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault(); document.getElementById('btnLog').disabled = true;
            const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email: document.getElementById('logEmail').value, password: document.getElementById('logPass').value });
            if (error) { showMsg("Credenciales inválidas"); document.getElementById('btnLog').disabled = false; return; }
            const { data: p } = await window.supabaseClient.from('profiles').select('rol').eq('id', data.user.id).single();
            window.location.href = p.rol === 'solicitante' ? 'mis_tramites.html' : 'admin_dashboard.html';
        });
        document.getElementById('formReg').addEventListener('submit', async (e) => {
            e.preventDefault(); document.getElementById('btnRegSubmit').disabled = true;
            const { data, error } = await window.supabaseClient.rpc('registrar_usuario_maestro', { p_email: document.getElementById('regEmail').value, p_password: document.getElementById('regPass').value, p_nombre: document.getElementById('regNom').value, p_rol: 'solicitante' });
            if (error || !data.success) { showMsg(data?.error || "Error al registrar."); document.getElementById('btnRegSubmit').disabled = false; return; }
            showMsg("Registro exitoso. Iniciando...", false);
            await window.supabaseClient.auth.signInWithPassword({ email: document.getElementById('regEmail').value, password: document.getElementById('regPass').value });
            setTimeout(() => window.location.href = 'mis_tramites.html', 1000);
        });
    </script>
</body>
</html>

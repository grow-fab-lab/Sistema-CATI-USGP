<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Sistema CATI USGP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

    <nav class="bg-red-800 text-white shadow-lg border-b border-red-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-3">
                <div class="group flex items-center bg-white px-3.5 py-1.5 rounded-xl shadow-md border border-slate-200">
                    <img src="logo-emprendimiento.jpg" alt="Departamento de Emprendimiento USGP" class="h-11 w-auto object-contain">
                </div>
                <div class="text-center hidden sm:block">
                    <span class="block text-sm font-bold tracking-wide uppercase text-white">Gestión de Propiedad Intelectual</span>
                    <span class="text-[11px] text-red-200">Universidad San Gregorio de Portoviejo</span>
                </div>
                <div class="group flex items-center bg-white px-3.5 py-1.5 rounded-xl shadow-md border border-slate-200">
                    <img src="logo-CATI-2026-new.jpg" alt="CATI USGP" class="h-11 w-auto object-contain">
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            
            <div class="flex border-b border-slate-200 text-sm font-semibold">
                <button id="btnTabLogin" onclick="cambiarTab('login')" class="w-1/2 py-4 text-center text-red-700 bg-white border-b-2 border-red-700 transition">Iniciar Sesión</button>
                <button id="btnTabRegistro" onclick="cambiarTab('registro')" class="w-1/2 py-4 text-center text-slate-500 bg-slate-50 hover:text-slate-700 hover:bg-slate-100 transition">Crear Cuenta</button>
            </div>

            <div class="p-6">
                <div id="errorContainer" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded-lg font-semibold text-xs text-center">
                    <span id="errorTexto"></span>
                </div>
                <div id="successContainer" class="hidden mb-4 bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-2 rounded-lg font-semibold text-xs text-center">
                    <span id="successTexto"></span>
                </div>

                <form id="formLogin" class="space-y-4 block">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Correo Institucional</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" id="loginEmail" required placeholder="usuario@sangregorio.edu.ec" 
                                   class="w-full pl-10 pr-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-700 focus:border-red-700 transition">
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-semibold text-slate-700 uppercase">Contraseña</label>
                            <button type="button" onclick="abrirModalCati()" class="text-xs text-red-700 hover:underline font-medium focus:outline-none">
                                ¿Olvidaste tu contraseña?
                            </button>
                        </div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-key"></i></span>
                            <input type="password" id="loginPassword" required placeholder="••••••••" 
                                   class="w-full pl-10 pr-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-700 focus:border-red-700 transition">
                        </div>
                    </div>
                    <button type="submit" id="btnLoginSubmit" class="w-full bg-red-700 hover:bg-red-800 text-white font-medium py-2.5 rounded-lg text-sm shadow-md transition">
                        Ingresar a la Plataforma
                    </button>
                </form>

                <form id="formRegistro" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nombres y Apellidos Completos</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                            <input type="text" id="regNombre" required placeholder="Ej. Lcda. María Pérez" 
                                   class="w-full pl-10 pr-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-700 transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Correo Institucional (USGP)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" id="regEmail" required placeholder="usuario@sangregorio.edu.ec" 
                                   class="w-full pl-10 pr-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-700 transition">
                        </div>
                        <p class="text-[10px] text-slate-500 mt-1">Solo se admiten correos @sangregorio.edu.ec</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Contraseña</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-key"></i></span>
                            <input type="password" id="regPassword" required minlength="6" placeholder="Mínimo 6 caracteres" 
                                   class="w-full pl-10 pr-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-700 transition">
                        </div>
                    </div>
                    <button type="submit" id="btnRegSubmit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-lg text-sm shadow-md transition">
                        Registrarme como Solicitante
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- MODAL CATI -->
    <div id="modalCati" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden">
            <div class="bg-red-800 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-circle-info"></i> Recuperación de Acceso</h3>
                <button onclick="cerrarModalCati()" class="text-white hover:text-red-200 text-lg font-bold">&times;</button>
            </div>
            <div class="p-6 space-y-4 text-xs text-slate-700">
                <p class="font-semibold text-slate-800">Para restablecer su contraseña, comuníquese con el administrador del sistema en el CATI.</p>
                <div class="p-3 bg-red-50 border border-red-200 rounded-xl">
                    <p class="font-bold text-slate-800 mb-2"><i class="fa-solid fa-envelope text-red-700"></i> cati@sangregorio.edu.ec</p>
                </div>
            </div>
            <div class="bg-slate-50 p-4 border-t flex justify-end">
                <button onclick="cerrarModalCati()" class="px-4 py-2 bg-red-700 text-white rounded-lg font-semibold text-xs">Entendido</button>
            </div>
        </div>
    </div>

    <script>
        function abrirModalCati() { document.getElementById('modalCati').classList.remove('hidden'); }
        function cerrarModalCati() { document.getElementById('modalCati').classList.add('hidden'); }

        const errContainer = document.getElementById('errorContainer');
        const errTexto = document.getElementById('errorTexto');
        const successContainer = document.getElementById('successContainer');
        const successTexto = document.getElementById('successTexto');

        function cambiarTab(tab) {
            errContainer.classList.add('hidden'); successContainer.classList.add('hidden');
            const formLogin = document.getElementById('formLogin'), formRegistro = document.getElementById('formRegistro');
            const btnLogin = document.getElementById('btnTabLogin'), btnRegistro = document.getElementById('btnTabRegistro');

            if (tab === 'login') {
                formLogin.classList.replace('hidden', 'block'); formRegistro.classList.replace('block', 'hidden');
                btnLogin.className = "w-1/2 py-4 text-center text-red-700 bg-white border-b-2 border-red-700 transition";
                btnRegistro.className = "w-1/2 py-4 text-center text-slate-500 bg-slate-50 hover:bg-slate-100 transition";
            } else {
                formRegistro.classList.replace('hidden', 'block'); formLogin.classList.replace('block', 'hidden');
                btnRegistro.className = "w-1/2 py-4 text-center text-red-700 bg-white border-b-2 border-red-700 transition";
                btnLogin.className = "w-1/2 py-4 text-center text-slate-500 bg-slate-50 hover:bg-slate-100 transition";
            }
        }

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault(); errContainer.classList.add('hidden');
            const btn = document.getElementById('btnLoginSubmit');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Ingresando...'; btn.disabled = true;
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ 
                    email: document.getElementById('loginEmail').value.trim(), 
                    password: document.getElementById('loginPassword').value 
                });
                if (error) throw error;
                const { data: profile } = await supabaseClient.from('profiles').select('rol').eq('id', data.user.id).single();
                window.location.href = (profile && profile.rol !== 'solicitante') ? 'admin_dashboard.html' : 'mis_tramites.html';
            } catch (err) {
                errTexto.innerText = 'Correo o contraseña incorrectos.'; errContainer.classList.remove('hidden');
                btn.disabled = false; btn.innerHTML = 'Ingresar a la Plataforma';
            }
        });

        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault(); errContainer.classList.add('hidden'); successContainer.classList.add('hidden');
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const btn = document.getElementById('btnRegSubmit');
            
            if (!email.endsWith('@sangregorio.edu.ec')) {
                errTexto.innerText = "Solo se permiten correos @sangregorio.edu.ec."; errContainer.classList.remove('hidden'); return;
            }
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Registrando...'; btn.disabled = true;
            try {
                const { data, error } = await supabaseClient.auth.signUp({ email, password: document.getElementById('regPassword').value });
                if (error) throw error;
                if (data.user) await supabaseClient.from('profiles').insert([{ id: data.user.id, nombre_completo: document.getElementById('regNombre').value.trim(), email: email, rol: 'solicitante' }]);
                successTexto.innerText = "¡Cuenta creada con éxito! Ya puedes iniciar sesión."; successContainer.classList.remove('hidden');
                document.getElementById('formRegistro').reset(); setTimeout(() => cambiarTab('login'), 3000);
            } catch (err) {
                errTexto.innerText = err.message; errContainer.classList.remove('hidden');
            } finally {
                btn.disabled = false; btn.innerHTML = 'Registrarme como Solicitante';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Trámites - CATI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-red-800 text-white p-4 flex justify-between items-center"><h1 class="font-bold">Mis Trámites</h1><button onclick="salir()" class="underline text-sm">Cerrar Sesión</button></nav>
    <main class="max-w-5xl mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Solicitudes Realizadas</h2>
            <button onclick="nuevo()" class="bg-red-700 text-white px-4 py-2 rounded font-bold">Nueva Solicitud</button>
        </div>
        <div class="bg-white rounded shadow"><table class="w-full text-left text-sm"><thead class="bg-gray-50 border-b"><tr><th class="p-3">Código</th><th class="p-3">Obra</th><th class="p-3">Estado</th><th class="p-3">Acción</th></tr></thead><tbody id="lista"></tbody></table></div>
    </main>
    <script>
        let activos = 0;
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if(!session) return window.location.href='index.html';
            const { data } = await window.supabaseClient.from('expedientes').select('*').eq('usuario_id', session.user.id).order('created_at', {ascending: false});
            activos = data.filter(x => x.estado_general !== 'cerrado' && x.estado_general !== 'archivado').length;
            document.getElementById('lista').innerHTML = data.map(d => `<tr class="border-b"><td class="p-3 font-bold">${d.codigo_expediente}</td><td class="p-3">${d.titulo_obra}</td><td class="p-3 uppercase text-xs font-bold">${d.estado_general.replace('_',' ')}</td><td class="p-3"><a href="detalle_tramite.html?id=${d.id}" class="text-blue-600 underline font-bold">Ver Detalle</a></td></tr>`).join('');
        });
        function nuevo() { if(activos >= 3) alert("Límite de 3 trámites activos alcanzado."); else window.location.href='registro_expediente.html'; }
        async function salir() { await window.supabaseClient.auth.signOut(); window.location.href='index.html'; }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Expediente - CATI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <main class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-xl">
        <h2 class="text-2xl font-bold mb-6 border-b pb-2">Registro de Propiedad Intelectual</h2>
        <form id="formEx" class="space-y-4">
            <input type="text" id="titulo" required placeholder="Título de la Obra" class="w-full border p-2 rounded">
            <select id="area" required class="w-full border p-2 rounded"><option value="">Seleccione Área...</option><option value="Derecho de Autor">Derecho de Autor</option><option value="Propiedad Industrial">Propiedad Industrial</option><option value="Obtenciones Vegetales">Obtenciones Vegetales</option></select>
            <input type="text" id="aNom" required placeholder="Nombre del Autor" class="w-full border p-2 rounded">
            <input type="text" id="aCed" required placeholder="Cédula del Autor" class="w-full border p-2 rounded">
            <input type="text" id="aTel" required placeholder="Teléfono" class="w-full border p-2 rounded">
            <input type="text" id="aDir" required placeholder="Dirección Domiciliaria" class="w-full border p-2 rounded">
            <div class="border p-3 rounded bg-gray-50"><label class="block text-sm font-bold mb-1">Documento Cédula (PDF)</label><input type="file" id="fCed" accept=".pdf" required></div>
            <div class="border p-3 rounded bg-gray-50"><label class="block text-sm font-bold mb-1">Archivo de la Obra (PDF/ZIP)</label><input type="file" id="fObra" accept=".pdf,.zip,.rar" required></div>
            <div class="flex justify-between items-center pt-4"><a href="mis_tramites.html" class="text-gray-500 underline">Cancelar</a><button type="submit" id="btnS" class="bg-red-700 text-white px-6 py-2 rounded font-bold">Guardar y Enviar</button></div>
        </form>
    </main>
    <script>
        let uid;
        document.addEventListener('DOMContentLoaded', async () => { const { data } = await window.supabaseClient.auth.getSession(); if(!data.session) window.location.href='index.html'; uid = data.session.user.id; });
        async function upFile(f, path) {
            await window.supabaseClient.storage.from('documentos-cati').upload(path, f);
            return window.supabaseClient.storage.from('documentos-cati').getPublicUrl(path).data.publicUrl;
        }
        document.getElementById('formEx').addEventListener('submit', async (e) => {
            e.preventDefault(); document.getElementById('btnS').disabled = true;
            try {
                const uCed = await upFile(document.getElementById('fCed').files[0], `cedulas/${Date.now()}_ced.pdf`);
                const uOb = await upFile(document.getElementById('fObra').files[0], `obras/${Date.now()}_obra`);
                await window.supabaseClient.from('expedientes').insert([{ codigo_expediente: `CATI-${Date.now()}`, titulo_obra: document.getElementById('titulo').value, area_pi: document.getElementById('area').value, tipo_especifico: 'N/A', autor_nombre: document.getElementById('aNom').value, autor_cedula: document.getElementById('aCed').value, autor_telefono: document.getElementById('aTel').value, autor_direccion: document.getElementById('aDir').value, archivo_cedula_url: uCed, archivo_obra_url: uOb, usuario_id: uid }]);
                alert("Expediente registrado correctamente."); window.location.href='mis_tramites.html';
            } catch (err) { alert("Error al registrar"); document.getElementById('btnS').disabled = false; }
        });
    </script>
</body>
</html>

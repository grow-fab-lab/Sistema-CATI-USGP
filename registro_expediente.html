<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Obra - CATI USGP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">
    <nav class="bg-red-800 text-white shadow-lg border-b border-red-900">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="bg-white px-3 py-1 rounded-xl"><img src="logo-emprendimiento.jpg" class="h-10"></div>
            <a href="mis_tramites.html" class="text-sm font-bold text-white hover:text-red-200">Cancelar y Volver</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto py-8 px-4 flex-grow w-full">
        <h1 class="text-2xl font-bold text-slate-800 mb-6">Solicitud de Registro</h1>
        
        <form id="formExpediente" class="space-y-6">
            <div id="errorContainer" class="hidden bg-red-50 text-red-700 p-4 rounded-xl text-center text-sm font-bold"><span id="errorTexto"></span></div>

            <div class="bg-white rounded-2xl border p-6">
                <h2 class="font-bold text-base mb-4 border-b pb-2">1. Obra</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2"><label class="block text-xs font-bold mb-1">Título *</label><input type="text" id="tituloObra" required class="w-full px-3 py-2 border rounded-lg"></div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Área SENADI *</label>
                        <select id="areaSenadi" required class="w-full px-3 py-2 border rounded-lg">
                            <option value="">-- Seleccionar --</option>
                            <option value="Derecho de Autor">Derecho de Autor</option>
                            <option value="Propiedad Industrial">Propiedad Industrial</option>
                            <option value="Obtenciones Vegetales">Obtenciones Vegetales</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Tipo Específico *</label>
                        <select id="tipoObra" required disabled class="w-full px-3 py-2 border rounded-lg bg-slate-50"><option value="">-- Seleccione Área --</option></select>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl border p-6">
                <div class="flex justify-between border-b pb-2 mb-4"><h2 class="font-bold">2. Autores</h2><button type="button" onclick="addC()" class="text-xs text-red-700 font-bold border border-red-700 px-2 rounded">+ Coautor</button></div>
                <div id="autoresBox" class="space-y-4">
                    <div class="p-4 bg-slate-50 rounded-xl border relative">
                        <span class="bg-red-800 text-white text-[10px] px-2 py-1 rounded font-bold mb-2 inline-block">AUTOR PRINCIPAL</span>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div><label class="text-[11px] font-bold">Nombres *</label><input type="text" id="aNom" required class="w-full px-2 py-1 border rounded text-xs"></div>
                            <div><label class="text-[11px] font-bold">Cédula *</label><input type="text" id="aCed" required class="w-full px-2 py-1 border rounded text-xs"></div>
                            <div><label class="text-[11px] font-bold">Teléfono *</label><input type="text" id="aTel" required class="w-full px-2 py-1 border rounded text-xs"></div>
                            <div><label class="text-[11px] font-bold">Dirección *</label><input type="text" id="aDir" required class="w-full px-2 py-1 border rounded text-xs"></div>
                        </div>
                        <label class="text-[11px] font-bold block mb-1">Cédula (PDF) *</label><input type="file" id="fCed" required accept=".pdf" class="w-full text-xs">
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl border p-6">
                <h2 class="font-bold border-b pb-2 mb-4">3. Archivos</h2>
                <div class="space-y-3">
                    <div><label class="text-[11px] font-bold block mb-1">Obra Completa (ZIP/PDF) *</label><input type="file" id="fObra" required accept=".pdf,.zip" class="text-xs"></div>
                    <div><label class="text-[11px] font-bold block mb-1">Contrato (PDF) *</label><input type="file" id="fCont" required accept=".pdf" class="text-xs"></div>
                </div>
            </div>

            <div class="flex justify-end gap-3"><button type="submit" id="btnS" class="bg-red-700 text-white px-6 py-2 rounded-lg font-bold">Guardar Expediente</button></div>
        </form>
    </main>

    <script>
        let curU = null; let cId = 1;
        const senadi = { "Derecho de Autor": ["Obras Literarias", "Obras Artísticas", "Software"], "Propiedad Industrial": ["Marca", "Patente"], "Obtenciones Vegetales": ["Variedad Vegetal"] };
        
        document.getElementById('areaSenadi').addEventListener('change', function() {
            const t = document.getElementById('tipoObra'); t.innerHTML = '<option value="">-- Seleccionar --</option>';
            if(this.value && senadi[this.value]) { t.disabled = false; t.classList.remove('bg-slate-50'); senadi[this.value].forEach(op => t.innerHTML += `<option value="${op}">${op}</option>`); } 
            else { t.disabled = true; t.classList.add('bg-slate-50'); }
        });

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = 'index.html';
            curU = session.user;
            const { data: p } = await supabaseClient.from('profiles').select('nombre_completo').eq('id', curU.id).single();
            if(p) document.getElementById('aNom').value = p.nombre_completo;
        }

        function addC() {
            cId++; const d = document.createElement('div'); d.className = 'coautor-item p-4 bg-slate-50 rounded-xl border mt-4';
            d.innerHTML = `<div class="flex justify-between"><span class="bg-slate-700 text-white text-[10px] px-2 py-1 rounded font-bold mb-2 inline-block">COAUTOR ${cId-1}</span><button type="button" onclick="this.parentElement.parentElement.remove()" class="text-red-600 text-xs font-bold">Eliminar</button></div>
            <div class="grid grid-cols-2 gap-3 mb-3"><div><input type="text" placeholder="Nombres" required class="cNom w-full px-2 py-1 border rounded text-xs"></div><div><input type="text" placeholder="Cédula" required class="cCed w-full px-2 py-1 border rounded text-xs"></div><div><input type="text" placeholder="Teléfono" required class="cTel w-full px-2 py-1 border rounded text-xs"></div><div><input type="text" placeholder="Dirección" required class="cDir w-full px-2 py-1 border rounded text-xs"></div></div>
            <label class="text-[11px] font-bold block mb-1">Cédula (PDF) *</label><input type="file" required accept=".pdf" class="cF w-full text-xs">`;
            document.getElementById('autoresBox').appendChild(d);
        }

        async function subirF(file, folder) {
            const name = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
            const { error } = await supabaseClient.storage.from('documentos-cati').upload(`${folder}/${name}`, file);
            if (error) throw error;
            return supabaseClient.storage.from('documentos-cati').getPublicUrl(`${folder}/${name}`).data.publicUrl;
        }

        document.getElementById('formExpediente').addEventListener('submit', async (e) => {
            e.preventDefault(); const btn = document.getElementById('btnS'); btn.disabled = true; btn.innerText = 'Subiendo...';
            try {
                const uCed = await subirF(document.getElementById('fCed').files[0], 'cedulas');
                const uObr = await subirF(document.getElementById('fObra').files[0], 'obras');
                const uCon = await subirF(document.getElementById('fCont').files[0], 'contratos');
                
                const cod = `CATI-USGP-${Math.floor(100+Math.random()*900)}`;
                const { data: exp, error: eErr } = await supabaseClient.from('expedientes').insert([{
                    codigo_expediente: cod, titulo_obra: document.getElementById('tituloObra').value, area_pi: document.getElementById('areaSenadi').value,
                    tipo_especifico: document.getElementById('tipoObra').value, autor_nombre: document.getElementById('aNom').value,
                    autor_cedula: document.getElementById('aCed').value, autor_telefono: document.getElementById('aTel').value,
                    autor_direccion: document.getElementById('aDir').value, archivo_cedula_url: uCed, archivo_obra_url: uObr,
                    contrato_url: uCon, usuario_id: curU.id
                }]).select().single();
                if(eErr) throw eErr;

                for (let c of document.querySelectorAll('.coautor-item')) {
                    const cf = await subirF(c.querySelector('.cF').files[0], 'cedulas');
                    await supabaseClient.from('autores').insert([{ expediente_id: exp.id, nombre_completo: c.querySelector('.cNom').value, cedula: c.querySelector('.cCed').value, telefono: c.querySelector('.cTel').value, direccion: c.querySelector('.cDir').value, archivo_cedula_url: cf }]);
                }
                alert('Éxito! Código: ' + cod); window.location.href = 'mis_tramites.html';
            } catch (err) {
                document.getElementById('errorTexto').innerText = err.message; document.getElementById('errorContainer').classList.remove('hidden'); btn.disabled = false; btn.innerText = 'Guardar Expediente';
            }
        });
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin - CATI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-red-800 text-white p-4 flex justify-between items-center"><h1 class="font-bold">Dashboard Admin</h1><div><a href="admin_usuarios.html" class="underline mr-4">Gestión Usuarios</a><button onclick="salir()" class="underline">Salir</button></div></nav>
    <main class="max-w-6xl mx-auto p-6">
        <h2 class="text-2xl font-bold mb-6">Todos los Expedientes</h2>
        <div class="bg-white rounded shadow"><table class="w-full text-left text-sm"><thead class="bg-gray-50 border-b"><tr><th class="p-3">Código</th><th class="p-3">Autor</th><th class="p-3">Obra</th><th class="p-3">Estado</th><th class="p-3">Acción</th></tr></thead><tbody id="lista"></tbody></table></div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if(!session) return window.location.href='index.html';
            const { data } = await window.supabaseClient.from('expedientes').select('*').order('created_at', {ascending: false});
            document.getElementById('lista').innerHTML = data.map(d => `<tr class="border-b"><td class="p-3 font-bold">${d.codigo_expediente}</td><td class="p-3">${d.autor_nombre}</td><td class="p-3">${d.titulo_obra}</td><td class="p-3 uppercase text-xs font-bold">${d.estado_general.replace('_',' ')}</td><td class="p-3"><a href="detalle_tramite.html?id=${d.id}" class="text-blue-600 underline font-bold">Revisar</a></td></tr>`).join('');
        });
        async function salir() { await window.supabaseClient.auth.signOut(); window.location.href='index.html'; }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - CATI USGP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-red-800 text-white p-4 flex justify-between items-center"><h1 class="font-bold">Usuarios CATI</h1><a href="admin_dashboard.html" class="underline text-sm">Dashboard Expedientes</a></nav>
    <main class="max-w-5xl mx-auto p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold">Gestión de Personal</h2>
            <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-red-700 text-white px-4 py-2 rounded font-bold">Crear Usuario</button>
        </div>
        <div class="bg-white rounded shadow overflow-hidden">
            <table class="w-full text-left text-sm"><thead class="bg-gray-50 border-b"><tr><th class="p-3">Nombre</th><th class="p-3">Correo</th><th class="p-3">Rol</th><th class="p-3">Acciones</th></tr></thead><tbody id="lista"></tbody></table>
        </div>
    </main>
    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center">
        <form id="formUser" class="bg-white p-6 rounded-lg w-96 space-y-4">
            <h3 class="font-bold border-b pb-2">Nuevo Usuario Staff</h3>
            <input type="text" id="nuNom" required placeholder="Nombre" class="w-full border p-2 rounded">
            <input type="email" id="nuEmail" required placeholder="Correo" class="w-full border p-2 rounded">
            <input type="password" id="nuPass" required placeholder="Contraseña" class="w-full border p-2 rounded">
            <select id="nuRol" class="w-full border p-2 rounded"><option value="asistente">Asistente</option><option value="administrador">Administrador</option></select>
            <div class="flex justify-end gap-2"><button type="button" onclick="document.getElementById('modal').classList.add('hidden')" class="px-3 py-1 bg-gray-300 rounded">Cancelar</button><button type="submit" class="px-3 py-1 bg-red-700 text-white rounded">Guardar</button></div>
        </form>
    </div>
    <script>
        let currentUser;
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if(!session) return window.location.href='index.html';
            const { data } = await window.supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            if(data.rol !== 'superusuario' && data.rol !== 'administrador') return window.location.href='mis_tramites.html';
            currentUser = data; cargar();
        });
        async function cargar() {
            const { data } = await window.supabaseClient.from('profiles').select('*').order('created_at', {ascending: false});
            document.getElementById('lista').innerHTML = data.map(u => `<tr class="border-b"><td class="p-3">${u.nombre_completo}</td><td class="p-3">${u.email}</td><td class="p-3 uppercase text-xs font-bold">${u.rol}</td><td class="p-3"><button onclick="eliminar('${u.id}')" class="text-red-600 font-bold">Eliminar</button></td></tr>`).join('');
        }
        document.getElementById('formUser').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data, error } = await window.supabaseClient.rpc('registrar_usuario_maestro', { p_email: document.getElementById('nuEmail').value, p_password: document.getElementById('nuPass').value, p_nombre: document.getElementById('nuNom').value, p_rol: document.getElementById('nuRol').value });
            if(error || !data.success) alert(data?.error || "Error"); else { document.getElementById('modal').classList.add('hidden'); cargar(); }
        });
        async function eliminar(id) {
            if(!confirm("Requiere reingreso de contraseña para eliminar. ¿Continuar?")) return;
            const pass = prompt("Ingrese su contraseña actual:");
            const { error } = await window.supabaseClient.auth.signInWithPassword({ email: currentUser.email, password: pass });
            if(error) return alert("Contraseña incorrecta.");
            await window.supabaseClient.from('profiles').delete().eq('id', id); cargar();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - CATI USGP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">
    
    <nav class="bg-slate-900 text-white shadow-lg border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-white px-2 py-1 rounded-lg"><img src="logo-emprendimiento.jpg" class="h-8"></div>
                <span class="font-bold text-sm tracking-wide">ADMINISTRACIÓN CATI</span>
            </div>
            <div class="flex items-center gap-6">
                <div class="hidden md:flex gap-4 text-sm font-semibold">
                    <a href="admin_dashboard.html" class="text-slate-300 hover:text-white">Gestión de Expedientes</a>
                    <a href="admin_usuarios.html" class="text-red-400 border-b-2 border-red-400 pb-1">Gestión de Usuarios</a>
                </div>
                <button onclick="window.location.href='index.html'" class="text-slate-400 hover:text-red-400 ml-2"><i class="fa-solid fa-right-from-bracket"></i> Volver</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto py-8 px-4 flex-grow w-full grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- COLUMNA IZQUIERDA: CREAR USUARIO -->
        <div class="md:col-span-1">
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 sticky top-8">
                <h2 class="font-bold text-slate-800 text-base mb-4 border-b pb-2"><i class="fa-solid fa-user-plus text-red-700"></i> Registrar Personal</h2>
                <form id="formNuevoUsuario" class="space-y-4">
                    <div id="msgRespuesta" class="hidden text-xs font-bold p-3 rounded-lg text-center"></div>
                    
                    <div><label class="block text-xs font-bold text-slate-700 mb-1">Nombre Completo *</label><input type="text" id="nuNombre" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-red-700"></div>
                    <div><label class="block text-xs font-bold text-slate-700 mb-1">Correo Institucional *</label><input type="email" id="nuEmail" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-red-700"></div>
                    <div><label class="block text-xs font-bold text-slate-700 mb-1">Contraseña (Mín. 6) *</label><input type="password" id="nuPassword" required minlength="6" class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-red-700"></div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Asignar Rol *</label>
                        <select id="nuRol" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-red-700">
                            <option value="asistente">Asistente CATI (Operativo)</option>
                            <option value="administrador">Administrador (Gestión Total)</option>
                            <option value="solicitante">Solicitante (Estudiante/Docente)</option>
                        </select>
                    </div>
                    <button type="submit" id="btnCrearUsuario" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-lg text-sm transition">Crear Cuenta</button>
                </form>
            </div>
        </div>

        <!-- COLUMNA DERECHA: LISTA DE USUARIOS -->
        <div class="md:col-span-2">
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-4 bg-slate-50 border-b flex justify-between items-center">
                    <h2 class="font-bold text-sm text-slate-700"><i class="fa-solid fa-users text-slate-500"></i> Personal y Usuarios Registrados</h2>
                    <button onclick="cargarUsuarios()" class="text-xs text-slate-500 hover:text-slate-800"><i class="fa-solid fa-rotate"></i> Refrescar</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="bg-slate-100/50 border-b text-xs text-slate-600 uppercase">
                                <th class="p-4">Usuario</th>
                                <th class="p-4">Rol en Sistema</th>
                                <th class="p-4 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios" class="divide-y divide-slate-100">
                            <tr><td colspan="3" class="p-8 text-center text-slate-400 font-semibold">Cargando usuarios...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL PASSWORD -->
    <div id="modalPasswordU" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
            <div class="bg-red-700 text-white p-4 font-bold text-sm flex justify-between"><span>Verificación de Seguridad</span><button onclick="cerrarModalPasswordU()">&times;</button></div>
            <div class="p-5">
                <p class="text-xs text-slate-600 mb-4 font-medium">Ingrese su contraseña para eliminar el acceso a este usuario.</p>
                <input type="password" id="confirmPasswordU" class="w-full px-3 py-2 border rounded-lg text-sm mb-4">
                <div id="errorPasswordU" class="text-red-600 text-xs font-bold mb-4 hidden"></div>
                <div class="flex justify-end gap-2">
                    <button onclick="cerrarModalPasswordU()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">Cancelar</button>
                    <button onclick="ejecutarEliminacionUsuario()" id="btnConfirmDeleteU" class="px-4 py-2 bg-red-700 text-white rounded-lg text-xs font-bold">Revocar Acceso</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null, userToDelete = null;

        // Cliente clonado para registrar sin cerrar la sesión del admin actual
        const authClon = supabase.createClient(supabaseClient.supabaseUrl, supabaseClient.supabaseKey, { auth: { persistSession: false, autoRefreshToken: false }});

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = 'index.html';
            currentUser = session.user;
            
            const { data: profile } = await supabaseClient.from('profiles').select('rol').eq('id', currentUser.id).single();
            if (!profile || (profile.rol !== 'superusuario' && profile.rol !== 'administrador')) {
                return window.location.href = 'admin_dashboard.html'; // Lo expulsa si es Asistente
            }
            cargarUsuarios();
        }

        async function cargarUsuarios() {
            const tb = document.getElementById('tablaUsuarios');
            const { data, error } = await supabaseClient.from('profiles').select('*').order('created_at', { ascending: false });
            
            if(error || !data) return tb.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-slate-500">Error al cargar usuarios.</td></tr>`;

            tb.innerHTML = data.map(u => {
                let badge = "bg-slate-100 text-slate-600 border-slate-300";
                if(u.rol === 'superusuario') badge = "bg-purple-100 text-purple-700 border-purple-300";
                if(u.rol === 'administrador') badge = "bg-red-100 text-red-700 border-red-300";
                if(u.rol === 'asistente') badge = "bg-blue-100 text-blue-700 border-blue-300";

                let btnBorrar = (u.rol !== 'superusuario' && u.id !== currentUser.id) 
                    ? `<button onclick="abrirModalPasswordU('${u.id}')" class="text-red-500 hover:bg-red-50 p-2 rounded transition"><i class="fa-solid fa-user-slash"></i></button>` : '';

                return `
                <tr class="hover:bg-slate-50">
                    <td class="p-4"><span class="block font-bold text-slate-800 text-xs">${u.nombre_completo}</span><span class="text-[11px] text-slate-500">${u.email}</span></td>
                    <td class="p-4"><span class="px-2 py-0.5 text-[10px] uppercase font-bold rounded border ${badge}">${u.rol}</span></td>
                    <td class="p-4 text-center">${btnBorrar}</td>
                </tr>`;
            }).join('');
        }

        // REGISTRAR USUARIO SIN CERRAR SESIÓN
        document.getElementById('formNuevoUsuario').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnCrearUsuario'); btn.disabled = true; btn.innerText = 'Registrando...';
            const msg = document.getElementById('msgRespuesta'); msg.classList.add('hidden');
            
            try {
                // Usamos el cliente clonado para que no afecte la sesión local del administrador
                const { data, error } = await authClon.auth.signUp({
                    email: document.getElementById('nuEmail').value.trim(),
                    password: document.getElementById('nuPassword').value,
                    options: { data: { nombre_completo: document.getElementById('nuNombre').value.trim(), rol: document.getElementById('nuRol').value } }
                });
                
                if (error) throw error;
                
                msg.innerText = "Usuario creado exitosamente."; msg.className = "text-xs font-bold p-3 rounded-lg text-center bg-emerald-50 text-emerald-700 border border-emerald-200 block mb-4";
                document.getElementById('formNuevoUsuario').reset();
                cargarUsuarios();
            } catch (err) {
                msg.innerText = err.message; msg.className = "text-xs font-bold p-3 rounded-lg text-center bg-red-50 text-red-700 border border-red-200 block mb-4";
            } finally {
                btn.disabled = false; btn.innerText = 'Crear Cuenta';
            }
        });

        function abrirModalPasswordU(id) { userToDelete = id; document.getElementById('confirmPasswordU').value = ''; document.getElementById('errorPasswordU').classList.add('hidden'); document.getElementById('modalPasswordU').classList.remove('hidden'); }
        function cerrarModalPasswordU() { userToDelete = null; document.getElementById('modalPasswordU').classList.add('hidden'); }

        async function ejecutarEliminacionUsuario() {
            const pass = document.getElementById('confirmPasswordU').value;
            const btn = document.getElementById('btnConfirmDeleteU');
            const err = document.getElementById('errorPasswordU');
            
            if(!pass) { err.innerText = 'Ingrese la contraseña.'; err.classList.remove('hidden'); return; }
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; btn.disabled = true;

            const { error: authError } = await supabaseClient.auth.signInWithPassword({ email: currentUser.email, password: pass });
            if (authError) {
                err.innerText = 'Contraseña incorrecta.'; err.classList.remove('hidden');
                btn.innerHTML = 'Revocar Acceso'; btn.disabled = false; return;
            }

            // Al borrar el perfil, el usuario pierde todo acceso a la app por las reglas de tu sistema
            const { error: deleteError } = await supabaseClient.from('profiles').delete().eq('id', userToDelete);
            
            if(deleteError) alert('Error: ' + deleteError.message);
            else { alert('Acceso revocado.'); cargarUsuarios(); cerrarModalPasswordU(); }
            
            btn.innerHTML = 'Revocar Acceso'; btn.disabled = false;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

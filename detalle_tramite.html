<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle Expediente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <main class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-xl space-y-6">
        <div>
            <h2 id="tit" class="text-2xl font-bold">Cargando...</h2>
            <span id="est" class="inline-block mt-2 px-3 py-1 text-xs font-bold uppercase rounded border"></span>
        </div>
        <div id="obsBox" class="bg-red-50 p-4 border border-red-200 text-red-800 rounded">Sin observaciones registradas.</div>
        <div class="grid grid-cols-2 gap-4 text-sm border-t pt-4">
            <div class="p-3 border rounded bg-gray-50 flex flex-col gap-2">
                <span class="font-bold">Cédula del Autor</span>
                <a id="lCed" target="_blank" class="text-blue-600 underline">Descargar Documento</a>
                <div id="repCed" class="hidden mt-2"><input type="file" id="nCed" class="text-xs w-full"><button onclick="reemplazar('archivo_cedula_url', 'nCed')" class="bg-red-700 text-white px-2 py-1 rounded text-xs mt-1 w-full font-bold">Reemplazar y Enviar a Revisión</button></div>
            </div>
            <div class="p-3 border rounded bg-gray-50 flex flex-col gap-2">
                <span class="font-bold">Archivo de Obra</span>
                <a id="lObra" target="_blank" class="text-blue-600 underline">Descargar Archivo</a>
                <div id="repObra" class="hidden mt-2"><input type="file" id="nObra" class="text-xs w-full"><button onclick="reemplazar('archivo_obra_url', 'nObra')" class="bg-red-700 text-white px-2 py-1 rounded text-xs mt-1 w-full font-bold">Reemplazar y Enviar a Revisión</button></div>
            </div>
        </div>
        <div id="divSenadi" class="hidden p-4 bg-green-50 border border-green-200 rounded text-center">
            <h3 class="font-bold text-green-800 mb-2">Trámite Finalizado</h3>
            <a id="lSenadi" target="_blank" class="bg-green-700 text-white px-4 py-2 rounded font-bold">Descargar Resolución SENADI[cite: 8]</a>
        </div>
        <div id="panelStaff" class="hidden border-t pt-4 space-y-4">
            <div class="bg-gray-50 p-4 rounded border">
                <h3 class="font-bold mb-2">Observaciones (Genera "Requiere Corrección")</h3>
                <textarea id="txtObs" class="w-full border p-2 rounded text-sm mb-2" rows="3"></textarea>
                <button onclick="enviarObservacion()" class="bg-amber-600 text-white px-4 py-2 rounded font-bold text-sm w-full">Registrar Observación y Cambiar Estado</button>
            </div>
            <div class="bg-gray-50 p-4 rounded border">
                <h3 class="font-bold mb-2">Cierre del Trámite[cite: 8]</h3>
                <input type="file" id="fSenadi" accept=".pdf" class="w-full border p-2 rounded text-sm bg-white mb-2">
                <button onclick="cerrarTramite()" class="bg-green-700 text-white px-4 py-2 rounded font-bold text-sm w-full">Cargar Resolución SENADI y Cerrar Expediente</button>
            </div>
        </div>
        <button onclick="window.history.back()" class="w-full border py-2 rounded font-bold text-gray-600 hover:bg-gray-100">Volver</button>
    </main>
    <script>
        const id = new URLSearchParams(window.location.search).get('id');
        let isStaff = false;
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            const { data: p } = await window.supabaseClient.from('profiles').select('rol').eq('id', session.user.id).single();
            isStaff = p.rol !== 'solicitante';
            const { data: exp } = await window.supabaseClient.from('expedientes').select('*').eq('id', id).single();
            document.getElementById('tit').innerText = `${exp.codigo_expediente} - ${exp.titulo_obra}`;
            document.getElementById('est').innerText = exp.estado_general.replace('_', ' ');
            document.getElementById('obsBox').innerText = exp.observaciones || "Sin observaciones.";
            document.getElementById('lCed').href = exp.archivo_cedula_url; document.getElementById('lObra').href = exp.archivo_obra_url;
            
            if (exp.estado_general === 'cerrado' && exp.documento_senadi_url) {
                document.getElementById('divSenadi').classList.remove('hidden');
                document.getElementById('lSenadi').href = exp.documento_senadi_url;
            } else if (isStaff) {
                document.getElementById('panelStaff').classList.remove('hidden');
            } else if (exp.estado_general === 'requiere_correccion') {
                document.getElementById('repCed').classList.remove('hidden');
                document.getElementById('repObra').classList.remove('hidden');
            }
        });
        async function enviarObservacion() {
            await window.supabaseClient.from('expedientes').update({ observaciones: document.getElementById('txtObs').value, estado_general: 'requiere_correccion' }).eq('id', id);
            location.reload();
        }
        async function cerrarTramite() {
            const f = document.getElementById('fSenadi').files[0]; if(!f) return alert("Seleccione el archivo SENADI");
            const path = `senadi/${Date.now()}_${f.name}`;
            await window.supabaseClient.storage.from('documentos-cati').upload(path, f);
            const url = window.supabaseClient.storage.from('documentos-cati').getPublicUrl(path).data.publicUrl;
            await window.supabaseClient.from('expedientes').update({ documento_senadi_url: url, estado_general: 'cerrado' }).eq('id', id);
            location.reload();
        }
        async function reemplazar(campo, inputId) {
            const f = document.getElementById(inputId).files[0]; if(!f) return alert("Seleccione archivo");
            const path = `reemplazos/${Date.now()}_${f.name}`;
            await window.supabaseClient.storage.from('documentos-cati').upload(path, f);
            const url = window.supabaseClient.storage.from('documentos-cati').getPublicUrl(path).data.publicUrl;
            await window.supabaseClient.from('expedientes').update({ [campo]: url, estado_general: 'en_revision' }).eq('id', id);
            location.reload();
        }
    </script>
</body>
</html>
